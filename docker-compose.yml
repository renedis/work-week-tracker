version: '3.8'

services:
  schedule-tracker:
    build: .
    container_name: schedule-tracker
    ports:
      - "3000:3000"
    volumes:
      - schedule-data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATA_DIR=/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/login"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  schedule-data:
    driver: local
